<!DOCTYPE html>
<html>
<head>
    <title>Medication Reminder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Medication Reminder</h1>

        <p class="intro">
            Keep track of your medication and never miss a dose.
        </p>

        <form action="/set-reminder" method="POST">

            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="medication">Medication Name</label>
            <input type="text" id="medication" name="medication" placeholder="e.g. Panado" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="reminder_time">Reminder Time</label>
            <input type="time" id="reminder_time" name="reminder_time" required>

            <button type="submit">Save Reminder</button>

        </form>

    </div>

</body>
</html>
